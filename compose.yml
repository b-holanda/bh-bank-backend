services:
  ms-auth:
    build: .
    image: bh-bank-backend:latest
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - 8080:3000
    environment:
      - NODE_ENV=production
    restart: always
    command: npm run start-ms-auth:prod
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    restart: always
    volumes:
      - db:/var/lib/postgresql/data
      - ./.docker/db/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db:
